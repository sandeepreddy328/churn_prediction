name: Lab 9 - Failure Handling

on:
  push:
    branches: [main, master]
    paths:
      - "config.yaml"
      - "src/mlops_pipeline/**"
      - "requirements.txt"
      - "data/raw/churn.csv"
      - ".github/workflows/lab9_failure_tests.yml"
  pull_request:
    paths:
      - "config.yaml"
      - "src/mlops_pipeline/**"
      - "requirements.txt"
      - "data/raw/churn.csv"
      - ".github/workflows/lab9_failure_tests.yml"
  workflow_dispatch:

jobs:
  lab9-failure-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run the MLOps pipeline
        run: python src/mlops_pipeline/churn_prediction_pipeline.py

      - name: Run Lab 9 failure and recovery scenarios
        run: python src/mlops_pipeline/10_failure_injection.py

      - name: Upload Lab 9 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab9-failure-reports-${{ github.run_number }}
          path: |
            reports/failure_report.json
            logs/churn_prediction_pipeline_run_log.json
          if-no-files-found: ignore